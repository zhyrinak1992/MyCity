name: Request Unity Personal activation file

on:
  workflow_dispatch:
  push:
    branches:
      - android-build-v2.167
    paths:
      - '.github/workflows/activation.yml'

jobs:
  activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: request
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: ${{ steps.request.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
